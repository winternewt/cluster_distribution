[project]
name = "cluster-distribution"
version = "0.1.0"
description = "DBSCAN cluster simulation and Beta-Prime distribution fitting for density-ratio analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "typer>=0.26.3",
]
authors = [
    {name = "Newton Winter", email = "isoutthere@gmail.com"},
]
maintainers = [
    {name = "Newton Winter", email = "isoutthere@gmail.com"}
]

[project.scripts]
cluster-distribution = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"webapp" = "webapp"
